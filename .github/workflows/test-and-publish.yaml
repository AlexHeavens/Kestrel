name: Test and publish

# Lint and test on every push and pull request. Publish the image to ECR only from main.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-and-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Lint (actionlint, ShellCheck, black, isort, flake8)
        run: make lint

      - name: Run tests
        run: make test

  # The branch protection requires this job name; do not rename it.
  build-image-and-publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Build the image
        run: make build_docker

      - name: Run the image and fetch the page
        run: make e2e_test

      - name: Configure AWS credentials
        if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::815823335496:role/ContinuousIntegration.Kestrel
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        if: env.PUBLISH == 'true'
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Retag and push the image to Amazon ECR
        if: env.PUBLISH == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: kestrel
          COMMIT_TAG: ${{ github.sha }}
          BRANCH_TAG: main
        run: |
          docker tag kestrel:local "$ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_TAG"
          docker tag kestrel:local "$ECR_REGISTRY/$ECR_REPOSITORY:$BRANCH_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$BRANCH_TAG"
